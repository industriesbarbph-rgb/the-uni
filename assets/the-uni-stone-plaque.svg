<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">THE UNI stone inscription</title>
<desc id="desc">A compact weathered stone block with THE UNI carved into its face and BarbPH engraved inside the I.</desc>
<defs>
  <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8d7a64"/>
    <stop offset=".22" stop-color="#6f604f"/>
    <stop offset=".56" stop-color="#51473c"/>
    <stop offset=".8" stop-color="#75624e"/>
    <stop offset="1" stop-color="#40372f"/>
  </linearGradient>
  <filter id="rough" x="-7%" y="-16%" width="114%" height="132%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".024 .085" numOctaves="4" seed="17" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="7.2" xChannelSelector="R" yChannelSelector="G" result="worn"/>
    <feTurbulence type="fractalNoise" baseFrequency=".14" numOctaves="2" seed="8" result="grain"/>
    <feColorMatrix in="grain" type="saturate" values="0" result="gray"/>
    <feComposite in="gray" in2="worn" operator="in" result="texture"/>
    <feBlend in="worn" in2="texture" mode="multiply" result="stone"/>
    <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".42"/>
    <feSpecularLighting in="noise" surfaceScale="3.1" specularConstant=".22" specularExponent="12" lighting-color="#d6b182" result="spec">
      <feDistantLight azimuth="225" elevation="38"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="worn" operator="in" result="specCut"/>
    <feBlend in="stone" in2="specCut" mode="screen"/>
  </filter>
  <filter id="cut" x="-15%" y="-25%" width="130%" height="150%">
    <feDropShadow dx="1.1" dy="1.8" stdDeviation=".8" flood-color="#b69470" flood-opacity=".38"/>
    <feDropShadow dx="-1.6" dy="-1.8" stdDeviation="1.1" flood-color="#17120f" flood-opacity=".92"/>
  </filter>
</defs>

<g filter="url(#rough)">
  <path d="M66 28Q83 19 107 21L1100 18Q1125 20 1138 37L1154 199Q1150 220 1125 226L96 231Q70 228 59 208L45 57Q46 39 66 28Z"
        fill="url(#rock)" stroke="#aa9276" stroke-opacity=".28" stroke-width="2.5"/>
</g>

<g opacity=".42" stroke="#2a221c" stroke-width="2.7" stroke-linecap="round">
  <path d="M122 73l55-8M314 205l72 4M905 58l79-5M1010 189l61 10M545 45l-21 16"/>
  <path d="M188 121l14 18 18-5M826 88l-11 24 18 13"/>
</g>

<g filter="url(#cut)" fill="#201813" stroke="#17120e" stroke-width="1.15" paint-order="stroke fill">
  <text x="184" y="163" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="800" letter-spacing="6">THE</text>
  <text x="425" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="145" font-weight="800" letter-spacing="-10">UN</text>
  <path d="M741 47h112v22h-29v118h29v22H741v-22h29V69h-29z"/>
</g>

<text transform="translate(810 178) rotate(-90)" fill="#b88d52" stroke="#241811" stroke-width=".7"
      font-family="Arial Narrow, Arial, Helvetica, sans-serif" font-size="20" font-weight="800" letter-spacing="1.1">BarbPH</text>
</svg>