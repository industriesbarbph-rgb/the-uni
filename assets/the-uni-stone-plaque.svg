<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">THE UNI stone inscription</title>
<desc id="desc">A weathered stone slab carved with THE UNI, with BarbPH engraved inside the I.</desc>
<defs>
  <linearGradient id="stoneBase" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9d8060"/>
    <stop offset=".18" stop-color="#6d5946"/>
    <stop offset=".47" stop-color="#4b4035"/>
    <stop offset=".72" stop-color="#735d47"/>
    <stop offset="1" stop-color="#342d27"/>
  </linearGradient>
  <linearGradient id="cut" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a1512"/>
    <stop offset=".48" stop-color="#33261d"/>
    <stop offset="1" stop-color="#b18a60"/>
  </linearGradient>
  <filter id="rough" x="-8%" y="-18%" width="116%" height="136%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".018 .055" numOctaves="4" seed="41" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" result="worn"/>
    <feTurbulence type="fractalNoise" baseFrequency=".15" numOctaves="2" seed="7" result="grain"/>
    <feColorMatrix in="grain" type="saturate" values="0" result="gray"/>
    <feComposite in="gray" in2="worn" operator="in" result="texture"/>
    <feBlend in="worn" in2="texture" mode="multiply" result="rock"/>
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".52"/>
    <feSpecularLighting in="noise" surfaceScale="3.3" specularConstant=".27" specularExponent="12" lighting-color="#e0b77c" result="spec">
      <feDistantLight azimuth="225" elevation="37"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="worn" operator="in" result="specCut"/>
    <feBlend in="rock" in2="specCut" mode="screen"/>
  </filter>
  <filter id="engrave" x="-10%" y="-25%" width="120%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="b"/>
    <feOffset in="b" dx="1.5" dy="2.4" result="down"/>
    <feSpecularLighting in="b" surfaceScale="2" specularConstant=".45" specularExponent="9" lighting-color="#caa474" result="shine">
      <feDistantLight azimuth="225" elevation="42"/>
    </feSpecularLighting>
    <feComposite in="shine" in2="SourceAlpha" operator="in" result="shineCut"/>
    <feMerge><feMergeNode in="down"/><feMergeNode in="SourceGraphic"/><feMergeNode in="shineCut"/></feMerge>
  </filter>
  <clipPath id="slabClip"><path d="M71 42Q83 27 108 29L1116 24Q1142 27 1151 48L1170 286Q1168 316 1138 324L101 330Q68 325 58 298L40 77Q42 54 71 42Z"/></clipPath>
</defs>

<g filter="url(#rough)">
  <path d="M71 42Q83 27 108 29L1116 24Q1142 27 1151 48L1170 286Q1168 316 1138 324L101 330Q68 325 58 298L40 77Q42 54 71 42Z"
        fill="url(#stoneBase)" stroke="#b89a78" stroke-opacity=".38" stroke-width="3"/>
</g>

<g clip-path="url(#slabClip)" opacity=".48" stroke="#211a16" stroke-width="3" stroke-linecap="round">
  <path d="M97 100l65-10m780 18 113-8M183 286l91 4m565-10 142-6M330 60l-28 18m654 167 41 19"/>
  <path d="M166 157l18 27 23-5M1012 112l-19 35 24 21M747 69l18 13-11 29"/>
</g>

<g aria-hidden="true" opacity=".18" fill="#d9c09b">
  <circle cx="131" cy="231" r="8"/><circle cx="1090" cy="94" r="6"/><circle cx="313" cy="294" r="5"/><circle cx="951" cy="279" r="9"/><circle cx="538" cy="68" r="5"/>
</g>

<g filter="url(#engrave)" fill="url(#cut)" stroke="#241a14" stroke-width="1.1" paint-order="stroke fill">
  <text x="138" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" letter-spacing="7">THE</text>
  <text x="430" y="251" font-family="Georgia, 'Times New Roman', serif" font-size="190" font-weight="700" letter-spacing="-8">UN</text>
  <path d="M930 78h132v25h-35v144h35v25H930v-25h35V103h-35z"/>
</g>

<text transform="translate(1014 232) rotate(-90)" fill="#b88a4c" stroke="#1e1510" stroke-width=".8"
      font-family="Arial Narrow, Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="1.3">BarbPH</text>
</svg>