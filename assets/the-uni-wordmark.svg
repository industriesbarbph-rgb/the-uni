<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 64" role="img" aria-labelledby="title desc">
<title id="title">THE UNI</title>
<desc id="desc">THE UNI carved-stone wordmark with BarbPH integrated vertically inside the letter I.</desc>
<defs>
  <linearGradient id="stone" x1="0" y1="0" x2="0.92" y2="1">
    <stop offset="0" stop-color="#f2d39f"/>
    <stop offset=".16" stop-color="#d7ad72"/>
    <stop offset=".48" stop-color="#b8844f"/>
    <stop offset=".72" stop-color="#d6a86d"/>
    <stop offset="1" stop-color="#8b5d35"/>
  </linearGradient>
  <linearGradient id="stoneEdge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff0c8"/>
    <stop offset=".45" stop-color="#b67d45"/>
    <stop offset="1" stop-color="#5f3b24"/>
  </linearGradient>
  <filter id="stoneTexture" x="-18%" y="-22%" width="136%" height="150%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".045 .085" numOctaves="3" seed="23" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
    <feComposite in="grayNoise" in2="SourceGraphic" operator="in" result="texture"/>
    <feBlend in="SourceGraphic" in2="texture" mode="multiply" result="stoneBase"/>
    <feTurbulence type="fractalNoise" baseFrequency=".018 .06" numOctaves="2" seed="9" result="chips"/>
    <feDisplacementMap in="stoneBase" in2="chips" scale="1.15" xChannelSelector="R" yChannelSelector="B" result="worn"/>
    <feDropShadow dx="0" dy="1.7" stdDeviation="1.25" flood-color="#100b08" flood-opacity=".78"/>
    <feSpecularLighting in="noise" surfaceScale="1.6" specularConstant=".42" specularExponent="12" lighting-color="#ffe1aa" result="spec">
      <feDistantLight azimuth="225" elevation="48"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceGraphic" operator="in" result="specCut"/>
    <feBlend in="worn" in2="specCut" mode="screen"/>
  </filter>
  <filter id="engrave" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx=".7" dy=".9" stdDeviation=".35" flood-color="#f3c56d" flood-opacity=".46"/>
    <feDropShadow dx="-.8" dy="-.9" stdDeviation=".45" flood-color="#24160d" flood-opacity=".95"/>
  </filter>
</defs>

<g filter="url(#stoneTexture)" fill="url(#stone)" stroke="url(#stoneEdge)" stroke-width=".9" paint-order="stroke fill">
  <text x="3" y="42.5" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" letter-spacing="2.6">THE</text>
  <text x="62" y="51" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" letter-spacing="-2.2">UN</text>

  <!-- Pillar-like I -->
  <path d="M219.5 8.5h42v7.5h-12.1v32h12.1v7.5h-42V48h12.2V16h-12.2z"/>
  <rect x="232.9" y="15.9" width="15.4" height="32.2" rx="1.2" fill="#6f472b" opacity=".42" stroke="#e2bb7c" stroke-width=".7"/>
</g>

<!-- BarbPH carved into the I -->
<text transform="translate(244.8 45.9) rotate(-90)" fill="#2b1b11" stroke="#d5a85d" stroke-width=".28"
      font-family="Arial Narrow, Arial, Helvetica, sans-serif" font-size="7.1" font-weight="800" letter-spacing=".36"
      filter="url(#engrave)">BarbPH</text>

<!-- sparse chisel marks -->
<g stroke="#5d3b25" stroke-width=".72" opacity=".46" stroke-linecap="round">
  <path d="M70 19l5 2.4M93 12l-4 3M122 41l6-1.7M163 16l5 2M188 38l4.4 2.4M225 13l5 1.4M251 51l4-1.2"/>
  <path d="M15 31l3-1.1M36 22l4 2M79 48l3.7-1.8M146 24l4-1.4M205 25l4 1.3"/>
</g>
</svg>