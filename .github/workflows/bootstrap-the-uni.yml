name: Bootstrap THE UNI source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-the-uni.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-the-uni
  cancel-in-progress: false

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and verify THE UNI source
        run: python .bootstrap/build.py

      - name: Commit verified production source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import verified THE UNI production source"
          git push origin main

# deterministic staged import


# safe deterministic production build trigger
