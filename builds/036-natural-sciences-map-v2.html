<!DOCTYPE html>
<html lang="en">
<head>
<link rel="up" href="/interactive-knowledge-library/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natural Sciences — Interactive Knowledge Map | THE UNI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root{
    --bg:#d9dce0;
    --panel:#f1f2f4;
    --panel-border:#b9bec5;
    --text:#20242b;
    --text-dim:#585d66;
    --line:#a3a9b2;
    --glass:linear-gradient(160deg, rgba(255,255,255,.92), rgba(230,232,236,.82));
    --shadow:0 12px 32px rgba(40,45,55,.14), 0 1px 6px rgba(40,45,55,.12);
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:linear-gradient(125deg,#B6BBC2 0%,#E4E7EB 10%,#CDD1D7 20%,#EEF0F3 30%,#C0C5CC 40%,#DEE1E6 50%,#B2B7BF 60%,#E9EBEE 70%,#C8CCD2 80%,#F2F3F5 90%,#BCC1C8 100%);
    background-size:500% 500%;
    animation:liquid 12s ease infinite;
  }
  body{overscroll-behavior:none}
  button,input{font:inherit}

  @keyframes liquid{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes sweep{0%{transform:translateX(-160%) skewX(-14deg);opacity:0}25%{opacity:1}75%{opacity:.7}100%{transform:translateX(320%) skewX(-14deg);opacity:0}}
  @keyframes cornerGlow{0%,100%{opacity:.7}50%{opacity:1}}
  @keyframes flow{to{stroke-dashoffset:-28}}
  @keyframes nodePulse{0%{opacity:.30;transform:scale(.78)}60%{opacity:.05;transform:scale(1.45)}100%{opacity:0;transform:scale(1.6)}}
  @keyframes drawerIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:translateX(0)}}
  @keyframes sheetIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes glint{0%,75%,100%{transform:translateX(-160%)}85%{transform:translateX(240%)}}

  #wrap{position:relative;width:100vw;height:100vh}
  #wrap::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle at 0% 0%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 38%),
      radial-gradient(circle at 100% 0%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 38%),
      radial-gradient(circle at 0% 100%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 38%),
      radial-gradient(circle at 100% 100%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 38%);
    animation:cornerGlow 5s ease-in-out infinite;
  }
  .sheen-top{position:absolute;inset:0;pointer-events:none;z-index:0;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.08) 35%,transparent 65%)}
  .sheen-bottom{position:absolute;bottom:0;left:0;right:0;height:38%;pointer-events:none;z-index:0;background:linear-gradient(180deg,transparent,rgba(120,126,136,.30))}
  .edge-line{position:absolute;top:0;left:0;right:0;height:1.5px;pointer-events:none;z-index:0;background:linear-gradient(90deg,transparent 5%,rgba(255,255,255,.95) 30%,rgba(255,255,255,.65) 50%,rgba(255,255,255,.95) 70%,transparent 95%)}
  .sweep-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .sweep-band{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
  .sweep-band.b1{width:46%;animation:sweep 6s 0s ease-in-out infinite}
  .sweep-band.b2{width:28%;animation:sweep 9s 3s ease-in-out infinite}

  svg{width:100%;height:100%;display:block;cursor:grab;position:relative;z-index:1;touch-action:none}
  svg:active{cursor:grabbing}

  .link{stroke:var(--line);stroke-opacity:.56;transition:stroke-opacity .25s,stroke-width .25s}
  .link.dim{stroke-opacity:.045}
  .link.lit{stroke:#5f6670;stroke-opacity:.96;stroke-width:2.2px;stroke-dasharray:8 6;animation:flow 1.05s linear infinite}
  .link.selected{stroke:#20242b;stroke-opacity:1;stroke-width:2.8px;stroke-dasharray:10 5;animation:flow .75s linear infinite}
  .link-hit{stroke:transparent;stroke-width:18px;pointer-events:stroke;cursor:pointer}

  .node{transition:opacity .25s}
  .node circle.core{stroke:var(--bg);stroke-width:1.5px;cursor:pointer;transition:opacity .22s,stroke .22s,stroke-width .22s,r .22s;filter:drop-shadow(0 1px 2px rgba(20,25,35,.12))}
  .node text{
    fill:var(--text);font-size:10.5px;pointer-events:none;text-anchor:middle;
    paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;
    transition:opacity .22s,font-size .22s;
  }
  .node .halo{fill:none;stroke:#20242b;stroke-width:1px;opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center}
  .node.dim circle.core,.node.dim text{opacity:.13}
  .node.lit circle.core{stroke:#20242b;stroke-width:2.6px}
  .node.lit text{font-size:11.5px;font-weight:650}
  .node.lit .halo{animation:nodePulse 1.15s ease-out}
  .node.connected circle.core{stroke:#5c626c;stroke-width:2px}
  .node.search-dim{opacity:.12}
  .node.search-hit circle.core{stroke:#20242b;stroke-width:2.5px}
  .node.search-hit .halo{opacity:.25}

  .glass{
    background:var(--glass);border:1px solid var(--panel-border);box-shadow:var(--shadow);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  }

  #panel{
    position:absolute;top:16px;left:16px;z-index:5;width:300px;max-width:calc(100vw - 32px);
    border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.5;
  }
  #panel h1{font-size:15px;font-weight:650;margin:0 0 3px;letter-spacing:.01em}
  #panel p.sub{color:var(--text-dim);margin:0 0 10px;font-size:12px}
  #detail{min-height:58px}
  #detail .name{font-weight:700;font-size:14px;margin-bottom:3px}
  #detail .cat{color:var(--text-dim);font-size:10.5px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.075em}
  #detail .desc{color:var(--text-dim)}
  #detail .placeholder{color:var(--text-dim);font-style:italic}
  .microline{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px;color:var(--text-dim);font-size:10.5px}
  .status-dot{width:6px;height:6px;border-radius:50%;background:#4e5660;box-shadow:0 0 0 3px rgba(78,86,96,.10)}

  .action{
    border:1px solid rgba(82,88,98,.30);background:rgba(255,255,255,.42);color:var(--text);
    border-radius:8px;padding:7px 10px;cursor:pointer;font-size:11px;font-weight:650;letter-spacing:.035em;
    transition:background .2s,transform .2s,border-color .2s;
  }
  .action:hover{background:rgba(255,255,255,.75);border-color:rgba(60,65,75,.45)}
  .action:active{transform:scale(.98)}
  .action.primary{margin-top:10px;width:100%;text-transform:uppercase}

  #toolbar{
    position:absolute;top:16px;right:16px;z-index:7;display:flex;align-items:center;gap:7px;
    padding:7px;border-radius:12px;
  }
  #searchBox{position:relative;display:flex;align-items:center}
  #searchInput{
    width:210px;border:0;outline:0;background:rgba(255,255,255,.28);border:1px solid rgba(82,88,98,.18);
    border-radius:8px;padding:8px 34px 8px 10px;color:var(--text);font-size:12px;
  }
  #searchInput::placeholder{color:#666c75}
  #searchIcon{position:absolute;right:10px;font-size:13px;color:var(--text-dim);pointer-events:none}
  .iconbtn{
    width:32px;height:32px;border-radius:8px;border:1px solid rgba(82,88,98,.22);background:rgba(255,255,255,.32);
    color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:13px;font-weight:700;
  }
  .iconbtn.on{background:rgba(32,36,43,.88);color:white}

  #hint{
    position:absolute;top:68px;right:16px;z-index:4;padding:7px 10px;border-radius:9px;font-size:10.5px;
    color:var(--text-dim);max-width:220px;
  }

  #legend{
    position:absolute;bottom:16px;left:16px;z-index:4;padding:10px 13px;border-radius:11px;font-size:10.5px;
    display:grid;grid-template-columns:repeat(2,auto);column-gap:14px;row-gap:5px;
  }
  #legend .item{display:flex;align-items:center;gap:6px;color:var(--text-dim);white-space:nowrap}
  #legend .dot{width:8px;height:8px;border-radius:50%;flex:none}

  #watermark{
    position:absolute;bottom:18px;right:22px;z-index:2;font-size:10px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(88,93,102,.45);text-shadow:0 0 8px rgba(210,215,225,.6);
    white-space:nowrap;pointer-events:none;user-select:none;
  }

  #drawer{
    position:absolute;z-index:8;right:16px;top:68px;bottom:16px;width:min(400px,calc(100vw - 32px));
    border-radius:14px;overflow:hidden;display:none;
  }
  #drawer.open{display:flex;flex-direction:column;animation:drawerIn .26s ease-out}
  #drawer::after{
    content:"";position:absolute;top:0;bottom:0;width:34%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);
    pointer-events:none;animation:glint 8s ease-in-out infinite;opacity:.45;
  }
  .drawer-head{padding:15px 16px 11px;border-bottom:1px solid rgba(90,96,106,.18);display:flex;gap:12px;align-items:flex-start;position:relative;z-index:1}
  .drawer-title{flex:1;min-width:0}
  .drawer-kicker{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--text-dim);margin-bottom:4px}
  .drawer-title h2{font-size:18px;line-height:1.15;margin:0;font-weight:720}
  .drawer-close{flex:none}
  .drawer-body{padding:14px 16px 20px;overflow:auto;position:relative;z-index:1;scrollbar-width:thin}
  .section-title{font-size:9.5px;font-weight:750;letter-spacing:.13em;color:var(--text-dim);text-transform:uppercase;margin:16px 0 8px}
  .section-title:first-child{margin-top:0}
  .lead{font-size:12.5px;line-height:1.6;color:#3f454e}
  .badge-row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
  .badge{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(82,88,98,.24);padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.28);color:#505660}
  .connection{
    width:100%;text-align:left;border:1px solid rgba(82,88,98,.18);background:rgba(255,255,255,.28);
    border-radius:10px;padding:10px 11px;margin-bottom:7px;cursor:pointer;color:var(--text);position:relative;overflow:hidden;
  }
  .connection:hover{background:rgba(255,255,255,.55);border-color:rgba(82,88,98,.34)}
  .connection .to{font-size:12px;font-weight:700;margin-bottom:3px;padding-right:18px}
  .connection .why{font-size:10.5px;color:var(--text-dim);line-height:1.45}
  .connection .arrow{position:absolute;right:10px;top:10px;color:var(--text-dim)}

  .source-card{
    display:block;text-decoration:none;color:inherit;border:1px solid rgba(82,88,98,.18);background:rgba(255,255,255,.25);
    border-radius:10px;padding:10px 11px;margin-bottom:7px;transition:background .18s,border-color .18s;
  }
  .source-card:hover{background:rgba(255,255,255,.58);border-color:rgba(82,88,98,.34)}
  .source-name{font-size:11.5px;font-weight:700;line-height:1.35}
  .source-meta{font-size:9.5px;color:var(--text-dim);margin-top:3px;letter-spacing:.02em}
  .source-note{font-size:10px;color:var(--text-dim);line-height:1.45;margin-top:8px}

  #pathbar{
    position:absolute;z-index:6;bottom:16px;left:50%;transform:translateX(-50%);
    max-width:min(620px,calc(100vw - 430px));min-width:260px;border-radius:11px;padding:8px 10px;display:none;
  }
  #pathbar.show{display:flex;align-items:center;gap:8px}
  #pathLabel{font-size:9px;font-weight:750;letter-spacing:.11em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
  #pathText{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;color:#3f454e}
  #clearPath{flex:none}

  #toast{
    position:absolute;z-index:20;left:50%;top:20px;transform:translateX(-50%) translateY(-10px);
    opacity:0;pointer-events:none;padding:7px 10px;border-radius:9px;font-size:10.5px;color:var(--text-dim);
    transition:opacity .2s,transform .2s;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:820px){
    #panel{width:270px}
    #searchInput{width:150px}
    #hint{display:none}
    #drawer{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:68vh;border-radius:16px}
    #drawer.open{animation:sheetIn .26s ease-out}
    #pathbar{left:8px;right:8px;bottom:8px;transform:none;max-width:none;min-width:0}
    #legend{bottom:12px}
    #watermark{display:block;bottom:12px;right:14px;font-size:9px;letter-spacing:.12em;z-index:5}
  }
  @media(max-width:640px){
    #panel{top:10px;left:10px;width:min(260px,calc(100vw - 82px));padding:11px 12px}
    #panel h1{font-size:13px}
    #panel p.sub{font-size:10.5px;margin-bottom:7px}
    #detail{min-height:0}
    #detail .desc{font-size:11px}
    #toolbar{top:10px;right:10px;padding:5px}
    #searchBox{display:none}
    #toolbar.searching #searchBox{display:flex;position:fixed;left:10px;right:10px;top:58px}
    #toolbar.searching #searchInput{width:100%;background:rgba(245,246,248,.94);box-shadow:var(--shadow)}
    #legend{grid-template-columns:1fr;padding:8px 10px;font-size:9.5px;max-height:128px;overflow:auto}
    .desktop-only{display:none}
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  }
</style>
<style id="coach-doll-public-dock-style">
/* THE UNI — compact public jewel controls */
#cdPublicDock{position:fixed;left:14px;bottom:14px;z-index:2147483000;display:flex;align-items:center;gap:7px;padding:5px 6px;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:linear-gradient(145deg,rgba(18,22,27,.76),rgba(5,7,10,.66));box-shadow:0 14px 42px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(18px) saturate(1.18);-webkit-backdrop-filter:blur(18px) saturate(1.18);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}

#cdPublicDock a:hover,#cdPublicDock a:focus-visible{transform:translateY(-2px);border-color:rgba(229,207,166,.50);box-shadow:inset 0 1px rgba(255,255,255,.16),0 0 22px rgba(222,193,141,.17);outline:none}
#cdPublicDock .cdWatch{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 1px rgba(255,255,255,.15),0 0 21px rgba(222,193,141,.13)}
#cdPublicDock .cdContact{width:34px;height:34px;border-radius:50%}
#cdPublicDock .cdWatch::before,#cdPublicDock .cdContact::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid rgba(229,204,151,.18);pointer-events:none}
#cdPublicDock .cdWatch::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(226,199,146,.11);animation:cdJewelBreath 5.6s ease-in-out infinite;pointer-events:none}
#cdPublicDock svg{width:16px;height:16px}.cdWatch svg{width:17px!important;height:17px!important}
.cdDockWord{width:auto!important;height:34px!important;padding:0 12px!important;border-radius:999px!important;font-size:8.5px!important;letter-spacing:.15em!important;text-transform:uppercase!important;color:#e9e1d7!important}
@keyframes cdJewelBreath{0%,100%{opacity:.32;transform:scale(.96)}50%{opacity:.9;transform:scale(1.04)}}
@media(max-width:680px){#cdPublicDock{left:8px;bottom:8px;gap:5px;padding:4px 5px}#cdPublicDock .cdWatch{width:36px;height:36px}#cdPublicDock .cdContact{width:33px;height:33px}.cdDockWord{width:33px!important;height:33px!important;padding:0!important;font-size:0!important}.cdDockWord::after{content:"⌂";font-size:15px}}
@media(prefers-reduced-motion:reduce){#cdPublicDock a{transition:none!important}#cdPublicDock .cdWatch::after{animation:none!important}}
</style>
<style id="coach-doll-node-dna-v2">
/* Node DNA V2 — preserves each subject palette while sharpening the living-network look */
.node circle.core{stroke:color-mix(in srgb,var(--accent) 44%,var(--bg));stroke-width:1.7px;filter:drop-shadow(0 0 4px rgba(255,255,255,.05)) drop-shadow(0 0 10px color-mix(in srgb,var(--accent) 23%,transparent))!important}
.node .halo{stroke:var(--accent);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--accent) 32%,transparent))}
.node:hover circle.core,.node.lit circle.core,.node.search-hit circle.core{stroke:var(--accent2);filter:drop-shadow(0 0 5px rgba(255,255,255,.14)) drop-shadow(0 0 16px color-mix(in srgb,var(--accent2) 40%,transparent))!important}
.link{filter:drop-shadow(0 0 2px color-mix(in srgb,var(--accent) 18%,transparent))}
.link.lit,.link.selected{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--accent2) 40%,transparent))}
</style>

<body>
<div id="wrap">
  
  <div class="sheen-top"></div>
  <div class="sheen-bottom"></div>
  <div class="edge-line"></div>
  <div class="sweep-wrap"><div class="sweep-band b1"></div></div>
  <div class="sweep-wrap"><div class="sweep-band b2"></div></div>

  <svg id="svg" aria-label="Interactive map of natural sciences"></svg>

  <section id="panel" class="glass">
    <h1>Natural Sciences</h1>
    <p class="sub">Touch a node to reveal its knowledge network</p>
    <div id="detail">
      <div class="placeholder">Select a field to see what it is, what it overlaps with, and why those connections exist.</div>
    </div>
  </section>

  <div id="toolbar" class="glass">
    <div id="searchBox">
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="Search fields…" aria-label="Search scientific fields">

function edgeKey(a,b){
  const direct = `${a}|||${b}`;
  const reverse = `${b}|||${a}`;
  return relationshipNotes[direct] ? direct : reverse;
}
function relationText(a,b){
  return relationshipNotes[edgeKey(a,b)] || `${a} and ${b} overlap because methods, concepts or evidence from one field are used to investigate questions in the other.`;
}
function linkNames(l){
  return [typeof l.source === "string" ? l.source : l.source.id, typeof l.target === "string" ? l.target : l.target.id];
}
function sourcesForNode(id){
  const n = nodeById.get(id);
  const items = [...(specialSources[id] || []), ...(sourceSets[n.cat] || [])];
  const seen = new Set();
  return items.filter(s => !seen.has(s.url) && seen.add(s.url)).slice(0,3);
}
function sourcesForEdge(a,b){
  const items = [...sourcesForNode(a), ...sourcesForNode(b)];
  const seen = new Set();
  const deduped = items.filter(s => !seen.has(s.url) && seen.add(s.url)).slice(0,4);
  deduped.push({
    name:`Literature search: ${a} + ${b}`,
    org:"Google Scholar",
    type:"Further literature search",
    url:`https://scholar.google.com/scholar?q=${encodeURIComponent(a+" "+b)}`
  });
  return deduped;
}

    .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  node.attr("transform",d=>`translate(${d.x},${d.y})`);
});

function drag(sim){
  function started(ev,d){
    if(!ev.active) sim.alphaTarget(.25).restart();
    d.fx=d.x; d.fy=d.y;
  }
  function dragged(ev,d){d.fx=ev.x;d.fy=ev.y}
  function ended(ev,d){
    if(!ev.active) sim.alphaTarget(0);
    d.fx=null;d.fy=null;
  }
  return d3.drag().on("start",started).on("drag",dragged).on("end",ended);
}

let currentNode = null;
let currentEdge = null;
let explorationPath = [];
let soundOn = false;
let audioCtx = null;

function uiTone(freq=520,duration=.035,volume=.025){
  if(!soundOn) return;
  try{
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), gain=audioCtx.createGain();
    o.type="sine";o.frequency.value=freq;
    gain.gain.setValueAtTime(volume,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
    o.connect(gain);gain.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+duration);
  }catch(e){}
}

function addToPath(id){
  if(!id) return;
  if(explorationPath.length===0 || explorationPath[explorationPath.length-1]!==id){
    explorationPath.push(id);
    if(explorationPath.length>8) explorationPath.shift();
  }
  renderPath();
}
function renderPath(){
  const bar=document.getElementById("pathbar");
  if(explorationPath.length<2){bar.classList.remove("show");return}
  document.getElementById("pathText").textContent=explorationPath.join("  →  ");
  bar.classList.add("show");
}
document.getElementById("clearPath").addEventListener("click",()=>{
  explorationPath=[];renderPath();uiTone(390,.035,.02);
});

function selectNode(d,openDrawer=false){
  currentNode=d;currentEdge=null;
  addToPath(d.id);
  const active = new Set([d.id,...neighbors.get(d.id)]);
  node.classed("dim",n=>!active.has(n.id))
      .classed("lit",n=>n.id===d.id)
      .classed("connected",n=>n.id!==d.id && active.has(n.id));
  visibleLink.classed("dim",l=>l.source.id!==d.id&&l.target.id!==d.id)
      .classed("lit",l=>l.source.id===d.id||l.target.id===d.id)
      .classed("selected",false);

  const related=[...neighbors.get(d.id)].sort();
  const sourceCount=sourcesForNode(d.id).length;
  document.getElementById("detail").innerHTML=`
    <div class="name">${escapeHtml(d.id)}</div>
    <div class="cat">${escapeHtml(categories[d.cat].label)}</div>
    <div class="desc">${escapeHtml(d.desc)}</div>
    <div class="microline"><span class="status-dot"></span>${related.length} mapped connections · ${sourceCount} reference sources</div>
    <button class="action primary" id="openField">Explore field →</button>
  `;
  document.getElementById("openField").onclick=()=>openFieldDrawer(d);
  if(openDrawer) openFieldDrawer(d);
  uiTone(560,.035,.022);
}

function openFieldDrawer(d){
  const drawer=document.getElementById("drawer");
  const related=[...neighbors.get(d.id)].sort();
  document.getElementById("drawerKicker").textContent="Field intelligence";
  document.getElementById("drawerTitle").textContent=d.id;
  const sourceCards=sourcesForNode(d.id).map(sourceCard).join("");
  const connectionCards=related.map(other=>`
    <button class="connection" data-a="${attr(d.id)}" data-b="${attr(other)}">
      <div class="to">${escapeHtml(other)}</div>
      <div class="why">${escapeHtml(relationText(d.id,other))}</div>
      <div class="arrow">›</div>
    </button>`).join("");
  document.getElementById("drawerBody").innerHTML=`
    <div class="section-title">${escapeHtml(categories[d.cat].label)}</div>
    <div class="lead">${escapeHtml(d.desc)}</div>
    <div class="badge-row">
      <span class="badge">${related.length} connections</span>
      <span class="badge">Sourced reference set</span>
      <span class="badge">Reviewed 16 Aug 2026</span>
    </div>
    <div class="section-title">Connections</div>
    ${connectionCards || '<div class="lead">No mapped connections.</div>'}
    <div class="section-title">Reference sources</div>
    ${sourceCards}
    <div class="source-note">Reference links support the field context. For publication-grade claims, add connection-specific papers or official references to the <code>specialSources</code> / evidence data in this file.</div>
  `;
  drawer.classList.add("open");
  drawer.querySelectorAll(".connection").forEach(btn=>btn.addEventListener("click",()=>{
    const edge=findEdge(btn.dataset.a,btn.dataset.b);
    if(edge) selectRelationship(edge,true);
  }));
}

function findEdge(a,b){
  return linkObjs.find(l=>{
    const [x,y]=linkNames(l);
    return (x===a&&y===b)||(x===b&&y===a);
  });
}

function selectRelationship(l,openDrawer=true){
  currentEdge=l;currentNode=null;
  const [a,b]=linkNames(l);
  const active=new Set([a,b]);
  node.classed("dim",n=>!active.has(n.id))
      .classed("lit",n=>active.has(n.id))
      .classed("connected",false);
  visibleLink.classed("dim",x=>x!==l)
      .classed("lit",false)
      .classed("selected",x=>x===l);

  document.getElementById("detail").innerHTML=`
    <div class="name">${escapeHtml(a)} × ${escapeHtml(b)}</div>
    <div class="cat">Relationship analysis</div>
    <div class="desc">${escapeHtml(relationText(a,b))}</div>
    <div class="microline"><span class="status-dot"></span>${sourcesForEdge(a,b).length-1} reference sources + literature search</div>
    <button class="action primary" id="openRelation">View evidence →</button>
  `;
  document.getElementById("openRelation").onclick=()=>openRelationshipDrawer(a,b);
  if(openDrawer) openRelationshipDrawer(a,b);
  uiTone(650,.05,.023);
}

function openRelationshipDrawer(a,b){
  const drawer=document.getElementById("drawer");
  document.getElementById("drawerKicker").textContent="Relationship analysis";
  document.getElementById("drawerTitle").textContent=`${a} × ${b}`;
  const sources=sourcesForEdge(a,b);
  document.getElementById("drawerBody").innerHTML=`
    <div class="section-title">Why this connection exists</div>
    <div class="lead">${escapeHtml(relationText(a,b))}</div>
    <div class="badge-row">
      <span class="badge">Mapped connection</span>
      <span class="badge">${sources.length-1} reference sources</span>
      <span class="badge">Literature search included</span>
    </div>
    <div class="section-title">Evidence & sources</div>
    ${sources.map(sourceCard).join("")}
    <div class="section-title">Continue exploring</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
      <button class="action" id="goA">${escapeHtml(a)}</button>
      <button class="action" id="goB">${escapeHtml(b)}</button>
    </div>
    <div class="source-note">This edition keeps the relationship explanation and its references visible together so visitors can inspect the basis for the line instead of treating the line as an unexplained claim.</div>
  `;
  drawer.classList.add("open");
  document.getElementById("goA").onclick=()=>selectNode(nodeById.get(a),true);
  document.getElementById("goB").onclick=()=>selectNode(nodeById.get(b),true);
}

function sourceCard(s){
  return `<a class="source-card" href="${attr(s.url)}" target="_blank" rel="noopener noreferrer">
    <div class="source-name">${escapeHtml(s.name)} ↗</div>
    <div class="source-meta">${escapeHtml(s.org)} · ${escapeHtml(s.type)}</div>
  </a>`;
}

function clearSelection(){
  currentNode=null;currentEdge=null;
  node.classed("dim",false).classed("lit",false).classed("connected",false);
  visibleLink.classed("dim",false).classed("lit",false).classed("selected",false);
  document.getElementById("detail").innerHTML='<div class="placeholder">Select a field to see what it is, what it overlaps with, and why those connections exist.</div>';
  closeDrawer();
}

function closeDrawer(){document.getElementById("drawer").classList.remove("open")}
document.getElementById("drawerClose").addEventListener("click",()=>{closeDrawer();uiTone(430,.03,.018)});

function escapeHtml(v){
  const map={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"};
  return String(v).replace(/[&<>"']/g,c=>map[c]);
}
function attr(v){return escapeHtml(v)}

const searchInput=document.getElementById("searchInput");
searchInput.addEventListener("input",()=>{
  const q=searchInput.value.trim().toLowerCase();
  if(!q){
    node.classed("search-dim",false).classed("search-hit",false);
    return;
  }
  node.classed("search-dim",d=>!d.id.toLowerCase().includes(q))
      .classed("search-hit",d=>d.id.toLowerCase().includes(q));
});
searchInput.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"){
    const q=searchInput.value.trim().toLowerCase();
    const hit=nodes.find(n=>n.id.toLowerCase().includes(q));
    if(hit){
      selectNode(hit,true);focusNode(hit);
      searchInput.blur();
      document.getElementById("toolbar").classList.remove("searching");
    }
  }
  if(ev.key==="Escape"){
    searchInput.value="";node.classed("search-dim",false).classed("search-hit",false);searchInput.blur();
  }
});

document.getElementById("mobileSearch").addEventListener("click",()=>{
  const tb=document.getElementById("toolbar");
  tb.classList.toggle("searching");
  if(tb.classList.contains("searching")) setTimeout(()=>searchInput.focus(),50);
});

function focusNode(d){
  const scale=1.45;
  const tx=w/2-d.x*scale;
  const ty=h/2-d.y*scale;
  svg.transition().duration(650).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(scale));
}
document.getElementById("resetView").addEventListener("click",()=>{
  svg.transition().duration(550).call(zoom.transform,d3.zoomIdentity);
  uiTone(470,.03,.018);
});

document.getElementById("soundToggle").addEventListener("click",ev=>{
  soundOn=!soundOn;
  ev.currentTarget.classList.toggle("on",soundOn);
  ev.currentTarget.textContent=soundOn?"●":"◌";
  if(soundOn) uiTone(600,.055,.025);
  showToast(soundOn?"Interface sound on":"Interface sound off");
});
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove("show"),1300);
}

const legend=document.getElementById("legend");
Object.values(categories).forEach(c=>{
  const item=document.createElement("div");
  item.className="item";
  item.innerHTML=`<span class="dot" style="background:${c.color}"></span>${escapeHtml(c.label)}`;
  legend.appendChild(item);
});

window.addEventListener("resize",()=>{
  const s=size();w=s.w;h=s.h;
  simulation.force("center",d3.forceCenter(w/2,h/2));
  simulation.alpha(.3).restart();
});

// Make touch targets calmer on mobile: tapping the drawer does not reset the graph.
["panel","toolbar","drawer","legend","pathbar"].forEach(id=>{
  document.getElementById(id)?.addEventListener("click",ev=>ev.stopPropagation());
});

/* IKL Knowledge Map system repair 2026-08-30 */
(function iklInstallMapLayoutRepair(){
  let iklUserMoved=false;
  let iklResizeTimer=null;
  const svgEl=document.getElementById("svg");
  if(!svgEl || typeof d3==="undefined" || typeof svg==="undefined" || typeof zoom==="undefined" || typeof nodes==="undefined") return;

  function visibleRect(el){
    if(!el) return null;
    const cs=getComputedStyle(el);
    if(cs.display==="none" || cs.visibility==="hidden" || Number(cs.opacity)===0) return null;
    const r=el.getBoundingClientRect();
    if(r.width<2 || r.height<2) return null;
    return r;
  }

  function resolveDockLegendCollision(){
    const legendEl=document.getElementById("legend");
    const dock=document.getElementById("cdPublicDock");
    if(!legendEl || !dock) return;
    if(!legendEl.dataset.iklBaseBottom){
      legendEl.dataset.iklBaseBottom=getComputedStyle(legendEl).bottom || "16px";
    }
    legendEl.style.bottom=legendEl.dataset.iklBaseBottom;
    requestAnimationFrame(()=>{
      const l=visibleRect(legendEl), d=visibleRect(dock);
      if(!l || !d) return;
      const overlap=!(l.right<d.left || l.left>d.right || l.bottom<d.top || l.top>d.bottom);
      if(overlap){
        const required=Math.max(12, window.innerHeight-d.top+14);
        legendEl.style.bottom=required+"px";
      }
    });
  }

  function safeArea(){
    const vw=window.innerWidth, vh=window.innerHeight;
    let left=24, right=vw-24, top=76, bottom=vh-24;
    const panel=visibleRect(document.getElementById("panel"));
    const toolbar=visibleRect(document.getElementById("toolbar"));
    const dock=visibleRect(document.getElementById("cdPublicDock"));
    const legendRect=visibleRect(document.getElementById("legend"));
    const chrono=visibleRect(document.getElementById("chronobar"));
    const timeline=visibleRect(document.getElementById("timelineBox"));

    if(vw>820){
      if(panel) left=Math.max(left,panel.right+30);
      if(toolbar) top=Math.max(top,toolbar.bottom+18);
    }else{
      if(panel) top=Math.max(top,panel.bottom+18);
      if(toolbar) top=Math.max(top,toolbar.bottom+18);
      left=18; right=vw-18;
    }
    if(dock) bottom=Math.min(bottom,dock.top-24);
    if(legendRect) bottom=Math.min(bottom,legendRect.top-18);
    if(chrono) bottom=Math.min(bottom,chrono.top-18);
    if(timeline && timeline.top>vh*.45) bottom=Math.min(bottom,timeline.top-18);

    if(right-left<240){left=18;right=vw-18;}
    if(bottom-top<220){top=76;bottom=vh-82;}
    return {left,right,top,bottom};
  }

  function fitMap(animate=true){
    resolveDockLegendCollision();
    requestAnimationFrame(()=>{
      const xs=nodes.map(d=>Number(d.x)).filter(Number.isFinite);
      const ys=nodes.map(d=>Number(d.y)).filter(Number.isFinite);
      if(!xs.length || !ys.length) return;
      const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
      const graphW=Math.max(120,maxX-minX), graphH=Math.max(120,maxY-minY);
      const a=safeArea();
      const safeW=Math.max(220,a.right-a.left), safeH=Math.max(220,a.bottom-a.top);
      const padding=58;
      let scale=Math.min((safeW-padding*2)/graphW,(safeH-padding*2)/graphH,1.25);
      scale=Math.max(.30,Math.min(1.25,scale));
      const graphCX=(minX+maxX)/2, graphCY=(minY+maxY)/2;
      const safeCX=(a.left+a.right)/2, safeCY=(a.top+a.bottom)/2;
      const tx=safeCX-graphCX*scale, ty=safeCY-graphCY*scale;
      const t=d3.zoomIdentity.translate(tx,ty).scale(scale);
      if(animate) svg.transition().duration(520).call(zoom.transform,t);
      else svg.call(zoom.transform,t);
    });
  }

  svgEl.addEventListener("pointerdown",()=>{iklUserMoved=true},{passive:true});
  svgEl.addEventListener("wheel",()=>{iklUserMoved=true},{passive:true});
  const reset=document.getElementById("resetView");
  if(reset){
    reset.addEventListener("click",ev=>{
      ev.preventDefault(); ev.stopImmediatePropagation(); iklUserMoved=false; fitMap(true);
    },true);
  }

  if(typeof simulation!=="undefined" && simulation && typeof simulation.on==="function")
    simulation.on("end.iklLayoutRepair",()=>{if(!iklUserMoved) fitMap(true);});

  setTimeout(()=>{if(!iklUserMoved) fitMap(false)},650);
  setTimeout(()=>{if(!iklUserMoved) fitMap(true)},1500);
  resolveDockLegendCollision();

  window.addEventListener("resize",()=>{
    clearTimeout(iklResizeTimer);
    iklResizeTimer=setTimeout(()=>{resolveDockLegendCollision();fitMap(false)},180);
  });
  window.iklFitKnowledgeMap=()=>fitMap(true);
})();
