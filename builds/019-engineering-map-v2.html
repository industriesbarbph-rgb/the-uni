function selectRelationship(l,openDrawer=true){currentEdge=l;currentNode=null;const[a,b]=linkNames(l),active=new Set([a,b]);node.classed("dim",n=>!active.has(n.id)).classed("lit",n=>active.has(n.id)).classed("connected",false);visibleLink.classed("dim",x=>x!==l).classed("lit",false).classed("selected",x=>x===l);document.getElementById("detail").innerHTML=`<div class="name">${escapeHtml(a)} × ${escapeHtml(b)}</div><div class="cat">Relationship analysis</div><div class="desc">${escapeHtml(relationText(a,b))}</div><div class="microline"><span class="status-dot"></span>${sourcesForEdge(a,b).length-1} reference sources + literature search</div><button class="action primary" id="openRelation">View evidence →</button>`;document.getElementById("openRelation").onclick=()=>openRelationshipDrawer(a,b);if(openDrawer)openRelationshipDrawer(a,b);uiTone(650,.05,.023)}
function openRelationshipDrawer(a,b){const drawer=document.getElementById("drawer");document.getElementById("drawerKicker").textContent="Relationship analysis";document.getElementById("drawerTitle").textContent=`${a} × ${b}`;const sources=sourcesForEdge(a,b);document.getElementById("drawerBody").innerHTML=`<div class="section-title">Why this connection exists</div><div class="lead">${escapeHtml(relationText(a,b))}</div><div class="badge-row"><span class="badge">Mapped connection</span><span class="badge">${sources.length-1} reference sources</span><span class="badge">Literature search included</span></div><div class="section-title">Evidence & sources</div>${sources.map(sourceCard).join("")}<div class="section-title">Continue exploring</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><button class="action" id="goA">${escapeHtml(a)}</button><button class="action" id="goB">${escapeHtml(b)}</button></div><div class="source-note">The explanation, reference set and literature search are kept together so the relationship can be inspected instead of appearing as an unexplained line.</div>`;drawer.classList.add("open");document.getElementById("goA").onclick=()=>selectNode(nodeById.get(a),true);document.getElementById("goB").onclick=()=>selectNode(nodeById.get(b),true)}
function sourceCard(s){return `<a class="source-card" href="${attr(s.url)}" target="_blank" rel="noopener noreferrer"><div class="source-name">${escapeHtml(s.name)} ↗</div><div class="source-meta">${escapeHtml(s.org)} · ${escapeHtml(s.type)}</div></a>`}
function clearSelection(){currentNode=null;currentEdge=null;node.classed("dim",false).classed("lit",false).classed("connected",false);visibleLink.classed("dim",false).classed("lit",false).classed("selected",false);document.getElementById("detail").innerHTML='<div class="placeholder">Select a field to see what it is, what it overlaps with, and why those connections exist.</div>';closeDrawer()}
function closeDrawer(){document.getElementById("drawer").classList.remove("open")}document.getElementById("drawerClose").addEventListener("click",()=>{closeDrawer();uiTone(430,.03,.018)});
function escapeHtml(v){const map={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"};return String(v).replace(/[&<>"']/g,c=>map[c])}function attr(v){return escapeHtml(v)}
const searchInput=document.getElementById("searchInput");searchInput.addEventListener("input",()=>{const q=searchInput.value.trim().toLowerCase();if(!q){node.classed("search-dim",false).classed("search-hit",false);return}node.classed("search-dim",d=>!d.id.toLowerCase().includes(q)).classed("search-hit",d=>d.id.toLowerCase().includes(q))});searchInput.addEventListener("keydown",ev=>{if(ev.key==="Enter"){const q=searchInput.value.trim().toLowerCase(),hit=nodes.find(n=>n.id.toLowerCase().includes(q));if(hit){selectNode(hit,true);focusNode(hit);searchInput.blur();document.getElementById("toolbar").classList.remove("searching")}}if(ev.key==="Escape"){searchInput.value="";node.classed("search-dim",false).classed("search-hit",false);searchInput.blur()}});

/* IKL Knowledge Map system repair 2026-08-30 */
(function iklInstallMapLayoutRepair(){
  let iklUserMoved=false;
  let iklResizeTimer=null;
  const svgEl=document.getElementById("svg");
  if(!svgEl || typeof d3==="undefined" || typeof svg==="undefined" || typeof zoom==="undefined" || typeof nodes==="undefined") return;

  function visibleRect(el){
    if(!el) return null;
    const cs=getComputedStyle(el);
    if(cs.display==="none" || cs.visibility==="hidden" || Number(cs.opacity)===0) return null;
    const r=el.getBoundingClientRect();
    if(r.width<2 || r.height<2) return null;
    return r;
  }

  function resolveDockLegendCollision(){
    const legendEl=document.getElementById("legend");
    const dock=document.getElementById("cdPublicDock");
    if(!legendEl || !dock) return;
    if(!legendEl.dataset.iklBaseBottom){
      legendEl.dataset.iklBaseBottom=getComputedStyle(legendEl).bottom || "16px";
    }
    legendEl.style.bottom=legendEl.dataset.iklBaseBottom;
    requestAnimationFrame(()=>{
      const l=visibleRect(legendEl), d=visibleRect(dock);
      if(!l || !d) return;
      const overlap=!(l.right<d.left || l.left>d.right || l.bottom<d.top || l.top>d.bottom);
      if(overlap){
        const required=Math.max(12, window.innerHeight-d.top+14);
        legendEl.style.bottom=required+"px";
      }
    });
  }

  function safeArea(){
    const vw=window.innerWidth, vh=window.innerHeight;
    let left=24, right=vw-24, top=76, bottom=vh-24;
    const panel=visibleRect(document.getElementById("panel"));
    const toolbar=visibleRect(document.getElementById("toolbar"));
    const dock=visibleRect(document.getElementById("cdPublicDock"));
    const legendRect=visibleRect(document.getElementById("legend"));
    const chrono=visibleRect(document.getElementById("chronobar"));
    const timeline=visibleRect(document.getElementById("timelineBox"));

    if(vw>820){
      if(panel) left=Math.max(left,panel.right+30);
      if(toolbar) top=Math.max(top,toolbar.bottom+18);
    }else{
      if(panel) top=Math.max(top,panel.bottom+18);
      if(toolbar) top=Math.max(top,toolbar.bottom+18);
      left=18; right=vw-18;
    }
    if(dock) bottom=Math.min(bottom,dock.top-24);
    if(legendRect) bottom=Math.min(bottom,legendRect.top-18);
    if(chrono) bottom=Math.min(bottom,chrono.top-18);
    if(timeline && timeline.top>vh*.45) bottom=Math.min(bottom,timeline.top-18);

    if(right-left<240){left=18;right=vw-18;}
    if(bottom-top<220){top=76;bottom=vh-82;}
    return {left,right,top,bottom};
  }

  function fitMap(animate=true){
    resolveDockLegendCollision();
    requestAnimationFrame(()=>{
      const xs=nodes.map(d=>Number(d.x)).filter(Number.isFinite);
      const ys=nodes.map(d=>Number(d.y)).filter(Number.isFinite);
      if(!xs.length || !ys.length) return;
      const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
      const graphW=Math.max(120,maxX-minX), graphH=Math.max(120,maxY-minY);
      const a=safeArea();
      const safeW=Math.max(220,a.right-a.left), safeH=Math.max(220,a.bottom-a.top);
      const padding=58;
      let scale=Math.min((safeW-padding*2)/graphW,(safeH-padding*2)/graphH,1.25);
      scale=Math.max(.30,Math.min(1.25,scale));
      const graphCX=(minX+maxX)/2, graphCY=(minY+maxY)/2;
      const safeCX=(a.left+a.right)/2, safeCY=(a.top+a.bottom)/2;
      const tx=safeCX-graphCX*scale, ty=safeCY-graphCY*scale;
      const t=d3.zoomIdentity.translate(tx,ty).scale(scale);
      if(animate) svg.transition().duration(520).call(zoom.transform,t);
      else svg.call(zoom.transform,t);
    });
  }

  svgEl.addEventListener("pointerdown",()=>{iklUserMoved=true},{passive:true});
  svgEl.addEventListener("wheel",()=>{iklUserMoved=true},{passive:true});
  const reset=document.getElementById("resetView");
  if(reset){
    reset.addEventListener("click",ev=>{
      ev.preventDefault(); ev.stopImmediatePropagation(); iklUserMoved=false; fitMap(true);
    },true);
  }

  if(typeof simulation!=="undefined" && simulation && typeof simulation.on==="function")
    simulation.on("end.iklLayoutRepair",()=>{if(!iklUserMoved) fitMap(true);});

  setTimeout(()=>{if(!iklUserMoved) fitMap(false)},650);
  setTimeout(()=>{if(!iklUserMoved) fitMap(true)},1500);
  resolveDockLegendCollision();

  window.addEventListener("resize",()=>{
    clearTimeout(iklResizeTimer);
    iklResizeTimer=setTimeout(()=>{resolveDockLegendCollision();fitMap(false)},180);
  });
  window.iklFitKnowledgeMap=()=>fitMap(true);
})();

 function all(selectors){const out=[];selectors.forEach(sel=>document.querySelectorAll(sel).forEach(el=>{if(!out.includes(el))out.push(el)}));return out}

 function restoreQuiet(el){if(el.dataset.iklQuieted!=='1')return;if(el.dataset.iklInlineVisibility==='')el.style.removeProperty('visibility');else el.style.visibility=el.dataset.iklInlineVisibility;if(el.dataset.iklInlineOpacity==='')el.style.removeProperty('opacity');else el.style.opacity=el.dataset.iklInlineOpacity;el.dataset.iklQuieted='0'}
